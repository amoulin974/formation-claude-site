site_name: Développer avec Claude
site_description: Formation à Claude Code pour des enseignants en informatique
site_author: Antoine Moulin
site_url: https://amoulin974.github.io/formation-claude-site/
repo_url: https://github.com/amoulin974/formation-claude-site
repo_name: formation-claude-site
edit_uri: edit/main/docs/
docs_dir: docs

theme:
  name: material
  language: fr
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - content.action.edit
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      toggle:
        icon: material/weather-night
        name: Mode sombre
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      toggle:
        icon: material/weather-sunny
        name: Mode clair

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.keys

nav:
  - Accueil: index.md
  - Séance 1:
      - Présentation: seance-1/index.md
      - Ce qu'est un LLM: seance-1/llm.md
      - Du chat à l'agent: seance-1/chat-agent.md
      - Panorama des outils: seance-1/panorama.md
      - "TP 1 : premier bug": seance-1/tp-premier-bug.md
      - CLAUDE.md et permissions: seance-1/claude-md-permissions.md
      - Travail intersession: seance-1/intersession.md
  - Séance 2:
      - Présentation: seance-2/index.md
      - Méthode de travail: seance-2/methode.md
      - "TP 2 : phase finale en TDD": seance-2/tp-tdd.md
      - Pièges et prompting: seance-2/pieges.md
      - Commandes et skills: seance-2/skills.md
      - Travail intersession: seance-2/intersession.md
  - Séance 3:
      - Présentation: seance-3/index.md
      - Extensions: seance-3/extensions.md
      - Un agent en cent lignes: seance-3/agent-api.md
      - Parallélisation et revue: seance-3/parallele-revue.md
      - Atelier pédagogique: seance-3/atelier-pedagogique.md
      - Synthèse: seance-3/synthese.md
  - Ressources:
      - Prérequis et installation: ressources/prerequis.md
